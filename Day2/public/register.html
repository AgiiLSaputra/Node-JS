<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - TokoBuku</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-container">
      <a href="/" class="logo">TokoBuku</a>
      <div class="nav-links">
        <a href="/index.html">Beranda</a>
        <a href="/blog.html">Blog</a>
        <a href="/shop.html">Toko</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="auth-page">
      <div class="auth-card">
        <h1>Daftar</h1>
        <p class="text-muted">Sudah punya akun? <a href="/login.html" class="link">Masuk</a></p>

        <div id="alertBox" class="alert" style="display: none;"></div>

        <form id="registerForm" class="form">
          <div class="form-group">
            <label for="name">Nama</label>
            <input type="text" id="name" name="name" required placeholder="Nama lengkap">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="email@contoh.com">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Minimal 6 karakter">
          </div>
          <div class="form-group">
            <label for="confirmPassword">Konfirmasi Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Ulangi password">
          </div>
          <button type="submit" class="btn btn-block" id="submitBtn">Daftar</button>
        </form>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alertBox');

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        alertBox.textContent = 'Password tidak cocok';
        alertBox.className = 'alert alert-error';
        alertBox.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Mendaftar...';

      const data = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: password
      };

      const result = await API.post('/api/auth/register', data);

      if (result.success) {
        localStorage.setItem('token', result.data.token);
        localStorage.setItem('user', JSON.stringify(result.data.user));
        window.location.href = '/';
      } else {
        alertBox.textContent = result.message || (result.errors ? result.errors.map(e => e.message).join(', ') : 'Gagal mendaftar');
        alertBox.className = 'alert alert-error';
        alertBox.style.display = 'block';
      }

      btn.disabled = false;
      btn.textContent = 'Daftar';
    });
  </script>
</body>
</html>
