<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - TokoBuku</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-container">
      <a href="/" class="logo">TokoBuku</a>
      <div class="nav-links">
        <a href="/index.html">Beranda</a>
        <a href="/blog.html">Blog</a>
        <a href="/shop.html">Toko</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="auth-page">
      <div class="auth-card">
        <h1>Masuk</h1>
        <p class="text-muted">Belum punya akun? <a href="/register.html" class="link">Daftar</a></p>

        <div id="alertBox" class="alert" style="display: none;"></div>

        <form id="loginForm" class="form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="email@contoh.com">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Minimal 6 karakter">
          </div>
          <button type="submit" class="btn btn-block" id="submitBtn">Masuk</button>
        </form>

        <div class="auth-divider"><span>atau</span></div>

        <div class="test-accounts">
          <p class="text-sm text-muted">Akun test:</p>
          <button type="button" class="btn btn-sm btn-block" onclick="fillAdmin()">Admin</button>
          <button type="button" class="btn btn-sm btn-block" onclick="fillUser()">User</button>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    function fillAdmin() {
      document.getElementById('email').value = 'admin@example.com';
      document.getElementById('password').value = 'admin123';
    }

    function fillUser() {
      document.getElementById('email').value = 'user@example.com';
      document.getElementById('password').value = 'user123';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alertBox');

      btn.disabled = true;
      btn.textContent = 'Masuk...';

      const data = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };

      const result = await API.post('/api/auth/login', data);

      if (result.success) {
        localStorage.setItem('token', result.data.token);
        localStorage.setItem('user', JSON.stringify(result.data.user));
        window.location.href = '/';
      } else {
        alertBox.textContent = result.message;
        alertBox.className = 'alert alert-error';
        alertBox.style.display = 'block';
      }

      btn.disabled = false;
      btn.textContent = 'Masuk';
    });
  </script>
</body>
</html>
