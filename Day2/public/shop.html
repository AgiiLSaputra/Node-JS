<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko - TokoBuku</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-container">
      <a href="/" class="logo">TokoBuku</a>
      <div class="nav-links">
        <a href="/index.html">Beranda</a>
        <a href="/blog.html">Blog</a>
        <a href="/shop.html" class="active">Toko</a>
        <a href="/cart.html" class="cart-link" id="cartLink">
          Keranjang <span class="cart-badge" id="cartBadge">0</span>
        </a>
        <div id="authNav"></div>
      </div>
      <button class="mobile-menu-btn" id="mobileMenuBtn">&#9776;</button>
    </div>
  </nav>

  <main class="container">
    <div class="page-header">
      <h1>Toko Buku</h1>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cari buku..." class="input-search">
        <button class="btn" onclick="searchProducts()">Cari</button>
      </div>
    </div>

    <div id="adminPanel" class="card mb-4" style="display: none;">
      <div class="card-body">
        <h3>Tambah Produk Baru</h3>
        <form id="productForm" class="form">
          <div class="form-row">
            <div class="form-group">
              <label for="productName">Nama Produk</label>
              <input type="text" id="productName" required>
            </div>
            <div class="form-group">
              <label for="productPrice">Harga</label>
              <input type="number" id="productPrice" min="0" required>
            </div>
            <div class="form-group">
              <label for="productStock">Stok</label>
              <input type="number" id="productStock" min="0" required>
            </div>
          </div>
          <div class="form-group">
            <label for="productDesc">Deskripsi</label>
            <textarea id="productDesc" rows="2"></textarea>
          </div>
          <button type="submit" class="btn">Tambah Produk</button>
        </form>
      </div>
    </div>

    <div class="product-grid" id="productList">
      <p class="text-muted">Memuat produk...</p>
    </div>
  </main>

  <footer class="footer">
    <div class="container"><p>Proyek Hari 2 - REST API dengan PostgreSQL</p></div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    let allProducts = [];

    async function loadProducts(search = '') {
      const url = search
        ? `/api/ecommerce/products?search=${encodeURIComponent(search)}`
        : '/api/ecommerce/products';
      const result = await API.get(url);
      const list = document.getElementById('productList');

      if (result.success && result.data.products.length) {
        allProducts = result.data.products;
        renderProducts(result.data.products);
      } else {
        list.innerHTML = '<p class="text-muted">Tidak ada produk ditemukan.</p>';
      }
    }

    function renderProducts(products) {
      const list = document.getElementById('productList');
      list.innerHTML = products.map(p => `
        <div class="card">
          <div class="card-body">
            <h3 class="card-title">${p.name}</h3>
            <p class="text-muted">${p.description || 'Tidak ada deskripsi'}</p>
            <div class="card-footer">
              <span class="price">Rp ${p.price.toLocaleString('id-ID')}</span>
              <span class="stock ${p.stock === 0 ? 'text-danger' : ''}">Stok: ${p.stock}</span>
            </div>
            <button class="btn btn-block mt-2" onclick="addToCart(${p.id})" ${p.stock === 0 ? 'disabled' : ''}>
              ${p.stock === 0 ? 'Habis' : 'Tambah ke Keranjang'}
            </button>
          </div>
        </div>
      `).join('');
    }

    function searchProducts() {
      const query = document.getElementById('searchInput').value;
      loadProducts(query);
    }

    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchProducts();
    });

    async function addToCart(productId) {
      const user = JSON.parse(localStorage.getItem('user'));
      if (!user) {
        window.location.href = '/login.html';
        return;
      }

      const result = await API.post('/api/ecommerce/cart/items', {
        productId,
        quantity: 1
      });

      if (result.success) {
        updateCartBadge();
        alert('Produk ditambahkan ke keranjang!');
      } else {
        alert(result.message || 'Gagal menambahkan ke keranjang');
      }
    }

    async function updateCartBadge() {
      const user = JSON.parse(localStorage.getItem('user'));
      if (!user) return;

      const result = await API.get('/api/ecommerce/cart');
      if (result.success) {
        const count = result.data.cart.items.reduce((sum, item) => sum + item.quantity, 0);
        document.getElementById('cartBadge').textContent = count;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const user = JSON.parse(localStorage.getItem('user'));
      if (user && user.role === 'ADMIN') {
        document.getElementById('adminPanel').style.display = 'block';

        document.getElementById('productForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const data = {
            name: document.getElementById('productName').value,
            description: document.getElementById('productDesc').value,
            price: parseFloat(document.getElementById('productPrice').value),
            stock: parseInt(document.getElementById('productStock').value)
          };

          const result = await API.post('/api/ecommerce/products', data);
          if (result.success) {
            document.getElementById('productForm').reset();
            loadProducts();
          } else {
            alert(result.message || 'Gagal menambahkan produk');
          }
        });
      }

      loadProducts();
      updateCartBadge();
    });
  </script>
</body>
</html>
